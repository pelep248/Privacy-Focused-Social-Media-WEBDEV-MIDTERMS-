<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings | Hush</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="settings" data-base="../">
  <nav id="nav"></nav>
  <main>
    <h1>Privacy settings</h1>
    <div class="card">
      <label><input type="checkbox" id="privateToggle">Private account (only I can see my posts)</label>
    </div>
    <div class="card">
      <h2>Delete my data</h2>
      <button id="deletePosts" class="danger">Delete all my posts</button>
      <button id="deleteAccount" class="danger">Delete my account</button>
    </div>
  </main>
  <script src="../src/js/main.js"></script>
</body>
</html>

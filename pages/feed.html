<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed | Hush</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="feed" data-base="../">
  <nav id="nav"></nav>
  <main>
    <h1>Feed</h1>
    <div class="card">
      <form id="postForm">
        <textarea id="postText" rows="3" maxlength="280" placeholder="Write something..."></textarea>
        <div class="row">
          <label class="inline"><input type="checkbox" id="anon">Post anonymously</label>
          <small id="count">0 / 280</small>
        </div>
        <button type="submit">Post</button>
      </form>
    </div>
    <input type="text" id="search" placeholder="Search posts">
    <div id="feedList"></div>
  </main>
  <script src="../src/js/main.js"></script>
</body>
</html>
